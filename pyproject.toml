[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nl2sparql-blockchain-kg"
version = "0.1.0"
description = "Natural language to SPARQL translation for blockchain knowledge graph analytics."
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }
authors = [
  { name = "Khoa VD" },
]
dependencies = [
  "accelerate>=0.30,<1.0",
  "bitsandbytes>=0.43,<0.46",
  "click>=8.1,<9",
  "datasets>=2.19,<3",
  "db-dtypes>=1.2,<2",
  "google-cloud-bigquery>=3.20,<4",
  "gradio>=4.30,<5",
  "jupyter>=1.0,<2",
  "loguru>=0.7,<1",
  "morph-kgc>=2.6,<3",
  "openai>=1.30,<2",
  "pandas>=2.2,<3",
  "peft>=0.10,<1",
  "pydantic>=2,<3",
  "pydantic-settings>=2,<3",
  "pyarrow>=15,<18",
  "pyshacl>=0.25,<1",
  "pyyaml>=6.0,<7",
  "rapidfuzz>=3.6,<4",
  "rdflib>=7.0,<8",
  "sentence-transformers>=2.7,<4",
  "sparqlwrapper>=2.0,<3",
  "torch>=2.3,<2.6",
  "transformers>=4.40,<4.50",
  "trl>=0.8,<1",
  "sqlglot>=30.17,<31",
]

[dependency-groups]
dev = [
  "pytest>=8.0,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.4,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/nl2sparql"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
